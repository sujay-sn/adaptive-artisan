<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The title and description are rewritten from src/data.ts at build (scripts/prerender.mjs). -->
    <title>Sujay S N | Software Engineer</title>
    <meta
      name="description"
      content="Sujay S N, full-stack software engineer in Boston. A portfolio built as a working Material 3 Expressive design system."
    />
    <!-- md:social -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/google-sans-flex-display.woff2" as="font" type="font/woff2" crossorigin />
    <!-- md:default-theme -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // Runs before first paint. Restores a light or dark override and a custom
      // theme from a previous visit, so the page never flashes the defaults.
      try {
        var scheme = localStorage.getItem('color-scheme');
        if (scheme) document.querySelector('meta[name="color-scheme"]').content = scheme;
        var css = localStorage.getItem('md-theme-css');
        if (css) {
          var style = document.createElement('style');
          style.id = 'md-theme';
          style.textContent = css;
          document.head.appendChild(style);
        }
        var prefs = JSON.parse(localStorage.getItem('md-preferences') || 'null');
        if (prefs && prefs.state && prefs.state.motionScheme === 'standard') {
          document.documentElement.setAttribute('data-motion-scheme', 'standard');
        }
        // Type axes from the hub. Mirrors typeAxesVars in src/preferences/typeAxes.ts.
        var t = prefs && prefs.state && prefs.state.typeAxes;
        if (t) {
          var d = { wght: 400, wdth: 100, opsz: 72, slnt: 0, GRAD: 0, ROND: 0 };
          for (var k in d) if (typeof t[k] !== 'number') t[k] = d[k];
          if (t.wght !== d.wght || t.wdth !== d.wdth || t.opsz !== d.opsz || t.slnt !== d.slnt || t.GRAD !== d.GRAD || t.ROND !== d.ROND) {
            var fvs = ['"slnt" ' + t.slnt, '"GRAD" ' + t.GRAD, '"ROND" ' + t.ROND];
            if (t.opsz !== d.opsz) fvs.push('"opsz" ' + t.opsz);
            var rs = document.documentElement.style;
            rs.setProperty('--md-wght-shift', String(t.wght - d.wght));
            rs.setProperty('--md-wdth-scale', String(t.wdth / d.wdth));
            rs.setProperty('--md-fvs', fvs.join(', '));
            rs.setProperty('--md-font-user', '"Google Sans Flex Playground"');
          }
        }
        // First visit this session (or ?bloom to replay it): paint in monochrome, ready for the bloom.
        var replay = /[?&]bloom(=|&|$)/.test(location.search);
        if ((replay || !sessionStorage.getItem('md-bloomed')) && 'startViewTransition' in document && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          var root = document.documentElement;
          root.setAttribute('data-bloom', '');
          // If the app never starts, don't leave the page in monochrome. Once it
          // has started, the bloom owns the attribute.
          setTimeout(function () {
            if (!root.hasAttribute('data-app-started')) root.removeAttribute('data-bloom');
          }, 5000);
        }
      } catch (e) {}
    </script>
    <!-- md:icon-font -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
